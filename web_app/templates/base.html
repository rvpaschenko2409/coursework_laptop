<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}СППР «Ноутбук»{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',path='/vendor/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static',path='/app.css') }}">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>
<header class="topbar"><div class="container nav-inner">
<a class="brand" href="/projects"><span class="brandmark" aria-hidden="true">Н</span><span>СППР «Ноутбук»</span></a>
<nav aria-label="Учётная запись" class="nav-user">
{% if user %}<a class="api-link" href="/docs">API</a><span class="user-name" title="{{ user.name }}">{{ user.name }}</span>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn btn-outline-secondary" type="submit">Выйти</button></form>
{% else %}<a href="/login">Вход</a><a class="btn btn-primary" href="/register">Регистрация</a>{% endif %}
</nav></div></header>
<main id="main" class="container main-content" tabindex="-1">{% block content %}{% endblock %}</main>
<footer class="container page-footer">Учебная система поддержки принятия решений · Вариант 27</footer>
</body></html>
