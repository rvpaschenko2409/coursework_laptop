{% macro icon(name,cls='ui-icon') -%}
<svg class="{{ cls }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{% if name=='laptop' %}<rect x="4" y="3" width="16" height="12" rx="2"/><path d="m4 15-2 4a1 1 0 0 0 1 2h18a1 1 0 0 0 1-2l-2-4M9 18h6M9 7h6M9 10h3"/>{% elif name=='arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>{% elif name=='grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>{% elif name=='chip' %}<rect x="6" y="6" width="12" height="12" rx="3"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/>{% elif name=='plus' %}<path d="M12 5v14M5 12h14"/>{% elif name=='chevron' %}<path d="m6 9 6 6 6-6"/>{% elif name=='shield' %}<path d="m12 3 8 3v6c0 4-5 8-8 9-3-1-8-5-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>{% endif %}</svg>
{%- endmacro %}

{% macro device_scene() -%}
<div class="device-scene" aria-hidden="true"><div class="device-orbit orbit-one"></div><div class="device-orbit orbit-two"></div><div class="device-screen"><div class="device-top"><i></i><i></i><i></i></div><div class="device-content"><div class="device-side"><b></b><b></b><b></b><b></b></div><div class="device-main"><span class="device-chip">{{ icon('chip') }}</span><div class="device-bars"><i></i><i></i><i></i><i></i></div><div class="device-panels"><b></b><b></b><b></b></div></div></div></div><div class="device-keyboard"></div><span class="device-spark spark-one"></span><span class="device-spark spark-two"></span></div>
{%- endmacro %}
