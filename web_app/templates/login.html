{% extends 'base.html' %}
{% block title %}Вход · СППР «Ноутбук»{% endblock %}
{% block content %}
<section class="auth-card card"><div class="card-body">
<p class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</p><h1>Вход</h1>
<p class="text-secondary">Войдите, чтобы открыть свои проекты выбора ноутбуков.</p>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="username" required value="{{ email }}"></div>
<div class="mb-4"><label class="form-label" for="password">Пароль</label><input class="form-control" id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required></div>
<button class="btn btn-primary w-100" type="submit">Войти</button>
</form><p class="auth-switch">Нет учётной записи? <a href="/register">Зарегистрироваться</a></p>
</div></section>
{% endblock %}
